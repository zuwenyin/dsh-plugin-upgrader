name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Typecheck both programs, build lib/ (host + client bundle) and run the
      # unit tests. `pnpm run check` is the same command contributors run locally.
      - name: Check
        run: pnpm run check
      # lib/ is committed (AGENTS.md §12): the DSH Store reviews a fixed commit
      # and refuses to run `prepare` to fill in missing runtime files. A source
      # change without its rebuilt output would ship a mismatched package, so
      # fail here instead of on the registry. `pnpm run check` runs this too; the
      # separate step makes the failure name itself in the run summary.
      - name: Committed build output is up to date
        run: node scripts/verify-build-committed.mjs
