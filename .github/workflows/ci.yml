name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Typecheck both programs, build lib/ (host + client bundle) and run the
      # unit tests. `npm run check` is the same command contributors run locally.
      - name: Check
        run: npm run check
