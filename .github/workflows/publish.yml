name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no long-lived token needed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Typecheck, build lib/ from src/ and run the unit tests. `prepack` also
      # builds, but running check first keeps a broken build off the registry.
      - name: Check
        run: pnpm run check
      # lib/ is committed (AGENTS.md §12). Publishing a tag whose build output
      # does not match its sources would put a mismatched package on the
      # registry, so this gate runs before `pnpm publish`.
      - name: Committed build output is up to date
        run: node scripts/verify-build-committed.mjs
      # Trusted publishing: GitHub mints a short-lived OIDC token and npm
      # verifies it against the trusted publisher configured for this package,
      # so there is no NPM_TOKEN secret to leak or rotate.
      #
      # Requires, on https://www.npmjs.com/package/dsh-plugin-upgrader/access:
      # GitHub Actions / zuwenyin / dsh-plugin-upgrader / publish.yml.
      # Without that connection the token exchange answers 404 and pnpm
      # degrades to an anonymous publish, which the registry refuses.
      #
      # --no-git-checks: a tag push checks out a detached HEAD, and pnpm's
      # publish-branch guard rejects that even though the tag names the commit.
      # The registry comes from publishConfig.registry, so no registry-url input
      # is needed either.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
