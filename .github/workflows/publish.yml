name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no long-lived token needed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Typecheck, build lib/ from src/ and run the unit tests. `prepare` also
      # builds, but running check first keeps a broken build off the registry.
      - name: Check
        run: pnpm run check
      # Trusted publishing: GitHub mints a short-lived OIDC token and npm
      # verifies it against the trusted publisher configured for this package,
      # so there is no NPM_TOKEN secret to leak or rotate.
      # Requires: the package exists on npm and lists this repository +
      # this workflow file as its trusted publisher.
      # pnpm attaches provenance on its own under trusted publishing.
      #
      # --no-git-checks: a tag push checks out a detached HEAD, and pnpm's
      # publish-branch check refuses that. The registry it publishes to comes
      # from publishConfig.registry, so no registry-url is set here (a
      # registry-url would write a throwaway token that shadows the OIDC flow).
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
